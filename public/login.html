<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Inventory Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex align-items-center login-page" style="height:100vh;">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card login-card shadow-sm">
        <div class="card-body">

          <div class="text-center mb-4">
            <img src="/images/logo.png" alt="Logo" class="login-logo" onerror="this.style.display='none'">
            <h3 class="card-title mt-2 mb-0">Inventory System</h3>
            <p class="login-subtitle">Sign in to continue</p>
          </div>

          <div id="errorMsg" class="alert alert-danger d-none"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label"><i class="bi bi-person"></i> Username</label>
              <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label"><i class="bi bi-lock"></i> Password</label>
              <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');

  const response = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });

  const result = await response.json();

  if (response.ok) {
    window.location.href = '/';
  } else {
    errorMsg.textContent = result.message;
    errorMsg.classList.remove('d-none');
  }
});
</script>

</body>
</html>
