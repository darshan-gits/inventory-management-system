<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ABC STORE - Inventory Management System</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .login-wrapper {
      width: 100%;
      max-width: 1050px;
      padding: 20px;
    }

    .login-container {
      display: flex;
      min-height: 570px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
    }

    /* LEFT SIDE */

    .brand-section {
      width: 48%;
      background: linear-gradient(145deg, #1d4ed8, #0f172a);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px;
      position: relative;
    }

    .brand-section::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      top: -100px;
      left: -100px;
    }

    .brand-section::after {
      content: "";
      position: absolute;
      width: 350px;
      height: 350px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      bottom: -180px;
      right: -150px;
    }

    .brand-content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .store-icon {
      width: 95px;
      height: 95px;
      margin: 0 auto 25px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
    }

    .brand-content h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .brand-content h2 {
      font-size: 20px;
      font-weight: 400;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .brand-line {
      width: 70px;
      height: 4px;
      background: white;
      border-radius: 10px;
      margin: 0 auto 25px;
    }

    .brand-description {
      max-width: 330px;
      margin: auto;
      line-height: 1.7;
      opacity: 0.8;
      font-size: 14px;
    }

    /* RIGHT SIDE */

    .login-section {
      width: 52%;
      padding: 60px 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    .login-content {
      width: 100%;
      max-width: 390px;
    }

    .login-heading {
      margin-bottom: 35px;
    }

    .login-heading h3 {
      font-size: 30px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .login-heading p {
      color: #6b7280;
      margin: 0;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-label {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper > i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b7280;
      z-index: 2;
    }

    .form-control {
      height: 52px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding-left: 45px;
      padding-right: 45px;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #6b7280;
      cursor: pointer;
      padding: 0;
      font-size: 18px;
    }

    .password-toggle:hover {
      color: #2563eb;
    }

    .login-button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.2s ease;
      margin-top: 5px;
    }

    .login-button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    .login-button:disabled {
      opacity: 0.7;
      transform: none;
      cursor: not-allowed;
    }

    .error-message {
      border-radius: 10px;
      font-size: 14px;
    }

    .footer-text {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 30px;
    }

    /* MOBILE */

    @media (max-width: 768px) {
      body {
        overflow: auto;
        padding: 20px 0;
      }

      .login-container {
        flex-direction: column;
      }

      .brand-section,
      .login-section {
        width: 100%;
      }

      .brand-section {
        min-height: 300px;
        padding: 35px 25px;
      }

      .brand-content h1 {
        font-size: 32px;
      }

      .brand-content h2 {
        font-size: 17px;
      }

      .brand-description {
        display: none;
      }

      .login-section {
        padding: 40px 30px;
      }
    }
  </style>
</head>

<body>

<div class="login-wrapper">

  <div class="login-container">

    <!-- BRANDING SECTION -->
    <div class="brand-section">

      <div class="brand-content">

        <div class="store-icon">
          <i class="bi bi-shop"></i>
        </div>

        <h1>ABC STORE</h1>

        <div class="brand-line"></div>

        <h2>Inventory Management System</h2>

        <p class="brand-description">
          Manage products, inventory, suppliers, stock and reports
          efficiently from one centralized system.
        </p>

      </div>

    </div>


    <!-- LOGIN SECTION -->
    <div class="login-section">

      <div class="login-content">

        <div class="login-heading">
          <h3>Welcome Back</h3>
          <p>Sign in to access your inventory dashboard.</p>
        </div>

        <!-- ERROR MESSAGE -->
        <div id="errorMsg"
             class="alert alert-danger error-message d-none">
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm">

          <!-- USERNAME -->
          <div class="form-group">

            <label class="form-label">
              Username
            </label>

            <div class="input-wrapper">

              <i class="bi bi-person"></i>

              <input
                type="text"
                id="username"
                class="form-control"
                placeholder="Enter your username"
                autocomplete="username"
                required
              >

            </div>

          </div>


          <!-- PASSWORD -->
          <div class="form-group">

            <label class="form-label">
              Password
            </label>

            <div class="input-wrapper">

              <i class="bi bi-lock"></i>

              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                aria-label="Show password">

                <i class="bi bi-eye"></i>

              </button>

            </div>

          </div>


          <!-- LOGIN BUTTON -->
          <button
            type="submit"
            class="login-button"
            id="loginButton">

            <i class="bi bi-box-arrow-in-right"></i>
            &nbsp; Login

          </button>

        </form>


        <div class="footer-text">
          © 2026 ABC STORE · Inventory Management System
        </div>

      </div>

    </div>

  </div>

</div>


<script>

/* ================================
   SHOW / HIDE PASSWORD
================================ */

document.getElementById('togglePassword').addEventListener('click', () => {

  const passwordInput = document.getElementById('password');
  const icon = document.querySelector('#togglePassword i');

  if (passwordInput.type === 'password') {

    passwordInput.type = 'text';

    icon.classList.remove('bi-eye');
    icon.classList.add('bi-eye-slash');

  } else {

    passwordInput.type = 'password';

    icon.classList.remove('bi-eye-slash');
    icon.classList.add('bi-eye');

  }

});


/* ================================
   LOGIN
================================ */

document.getElementById('loginForm').addEventListener('submit', async (e) => {

  e.preventDefault();

  const username =
    document.getElementById('username').value.trim();

  const password =
    document.getElementById('password').value;

  const errorMsg =
    document.getElementById('errorMsg');

  const loginButton =
    document.getElementById('loginButton');


  errorMsg.classList.add('d-none');

  loginButton.disabled = true;

  loginButton.innerHTML =
    '<span class="spinner-border spinner-border-sm"></span> &nbsp; Signing in...';


  try {

    const response = await fetch('/api/auth/login', {

      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify({
        username,
        password
      })

    });


    const result = await response.json();


    if (response.ok) {

      window.location.href = '/';

    } else {

      errorMsg.textContent =
        result.message || 'Invalid username or password.';

      errorMsg.classList.remove('d-none');

      loginButton.disabled = false;

      loginButton.innerHTML =
        '<i class="bi bi-box-arrow-in-right"></i> &nbsp; Login';

    }

  } catch (error) {

    console.error(error);

    errorMsg.textContent =
      'Unable to connect to the server. Please try again.';

    errorMsg.classList.remove('d-none');

    loginButton.disabled = false;

    loginButton.innerHTML =
      '<i class="bi bi-box-arrow-in-right"></i> &nbsp; Login';

  }

});

</script>

</body>
</html>
