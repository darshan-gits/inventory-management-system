<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
  
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container d-flex justify-content-between align-items-center flex-wrap py-2">

    <span class="navbar-brand mb-0 h1 d-flex align-items-center gap-2">
  <img src="/images/logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
  Inventory System
</span>

    <div class="d-flex align-items-center gap-2 flex-wrap">
      <a href="/index.html" class="btn btn-outline-light btn-sm">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
      <a href="/suppliers.html" class="btn btn-outline-light btn-sm">
        <i class="bi bi-truck"></i> Suppliers
      </a>
      <a href="/history.html" class="btn btn-outline-light btn-sm">
        <i class="bi bi-clock-history"></i> History
      </a>
      <a href="/audit.html" class="btn btn-outline-light btn-sm">
        <i class="bi bi-journal-text"></i> Audit
      </a>
      <a href="/reports.html" class="btn btn-outline-warning btn-sm">
        <i class="bi bi-bar-chart-line"></i> Reports
      </a>
    </div>

    <div class="d-flex align-items-center gap-3">
      <div class="notif-wrapper">
        <i class="bi bi-bell position-relative" id="notif-bell" style="font-size:1.2rem; cursor:pointer;" onclick="toggleNotifDropdown()">
          <span class="notif-dot" id="notif-dot" style="display:none;"></span>
        </i>
        <div id="notif-dropdown" class="notif-dropdown" style="display:none;">
          <div class="notif-header">Low stock alerts</div>
          <div id="notif-list"></div>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="avatar-circle" id="user-avatar">A</div>
        <span id="user-info" class="text-white"></span>
      </div>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>

  </div>
</nav>
<div class="container">

   <!-- Low Stock Alert Banner -->
  <div id="low-stock-banner" class="alert-banner" style="display:none;"></div>

  <!-- Dashboard Cards -->
  <div class="row mb-4">
    <div class="col-md-3">
      <div class="card text-white bg-primary shadow-sm kpi-card">
        <div class="card-body d-flex justify-content-between align-items-start">
          <div>
            <h6 class="card-title">Total Products</h6>
            <h2 id="total-products">0</h2>
          </div>
          <i class="bi bi-box-seam kpi-icon"></i>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-danger shadow-sm kpi-card">
        <div class="card-body d-flex justify-content-between align-items-start">
          <div>
            <h6 class="card-title">Low Stock Items</h6>
            <h2 id="low-stock">0</h2>
          </div>
          <i class="bi bi-exclamation-triangle kpi-icon"></i>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-success shadow-sm kpi-card">
        <div class="card-body d-flex justify-content-between align-items-start">
          <div>
            <h6 class="card-title">Inventory Value</h6>
            <h2 id="inventory-value">₹0</h2>
          </div>
          <i class="bi bi-currency-rupee kpi-icon"></i>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white shadow-sm kpi-card kpi-suppliers">
        <div class="card-body d-flex justify-content-between align-items-start">
          <div>
            <h6 class="card-title">Suppliers</h6>
            <h2 id="total-suppliers">0</h2>
          </div>
          <i class="bi bi-truck kpi-icon"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Stock Chart -->
  <div class="card mb-4">
    <div class="card-body">
      <h2 class="card-title h5 mb-3">Stock Levels</h2>
      <canvas id="stockChart" height="90"></canvas>
    </div>
  </div>

<!-- =========================
     Add Product Form
========================= -->
<div class="card mb-4">
  <div class="card-body">

    <h2 class="card-title h5 mb-3">Add Product</h2>

    <form id="productForm" class="row g-3" enctype="multipart/form-data">

      <!-- Hidden Product ID -->
      <input type="hidden" id="productId">

      <!-- Product Name -->
      <div class="col-md-3">
        <input
          type="text"
          id="name"
          class="form-control"
          placeholder="Product Name"
          required>
      </div>

      <!-- Quantity -->
      <div class="col-md-2">
        <input
          type="number"
          id="quantity"
          class="form-control"
          placeholder="Quantity"
          required>
      </div>

      <!-- Price -->
      <div class="col-md-2">
        <input
          type="number"
          id="price"
          class="form-control"
          placeholder="Price"
          required>
      </div>

      <!-- Reorder -->
      <div class="col-md-2">
        <input
          type="number"
          id="reorder"
          class="form-control"
          placeholder="Reorder Level"
          required>
      </div>

      <!-- Category -->
      <div class="col-md-3">
        <select id="category" class="form-control">
          <option value="">Select Category</option>
        </select>
      </div>

      <!-- Image Upload -->
      <div class="col-md-4">
        <input
          type="file"
          id="image"
          class="form-control"
          accept="image/*">
      </div>

      <!-- Image Preview -->
      <div class="col-md-2 text-center">
        <img
          id="preview"
          src=""
          alt="Preview"
          style="display:none;width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #ddd;">
      </div>

      <!-- Submit Button -->
      <div class="col-md-2">
        <button
          type="submit"
          id="submitBtn"
          class="btn btn-primary w-100">
          Add Product
        </button>
      </div>

    </form>

  </div>
</div>

<!-- Image Preview Script -->
<script>
document.getElementById('image').addEventListener('change', function () {

    const file = this.files[0];

    if (file) {

        const reader = new FileReader();

        reader.onload = function (e) {

            const preview = document.getElementById('preview');

            preview.src = e.target.result;

            preview.style.display = 'block';

        };

        reader.readAsDataURL(file);

    }

});
</script>

  <!-- Products Table -->
  <div class="card">
    <div class="card-body">
      <h2 class="card-title h5 mb-3">Products</h2>

      <div class="mb-3">
        <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search products by name...">
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-dark">
  <tr>
    <th>ID</th>
    <th>Image</th>
    <th>Name</th>
    <th>Category</th>
    <th>Quantity</th>
    <th>Price</th>
    <th>Reorder Level</th>
    <th>Action</th>
  </tr>
</thead>
          <tbody id="product-body">

          </tbody>
        </table>
      </div>

      <nav class="mt-3">
        <ul class="pagination justify-content-center" id="pagination"></ul>
      </nav>

    </div>
  </div>

</div>

<!-- =========================
     Edit Product Modal
========================= -->
<div id="editModal"
     style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
     background:rgba(0,0,0,.5); z-index:1000;">

  <div class="card" style="max-width:500px; margin:60px auto;">
    <div class="card-body">

      <h3 class="h5 mb-3">Edit Product</h3>

      <input type="hidden" id="edit-id">

      <!-- Product Name -->
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input
          type="text"
          id="edit-name"
          class="form-control">
      </div>

      <!-- Quantity -->
      <div class="mb-3">
        <label class="form-label">Quantity</label>
        <input
          type="number"
          id="edit-quantity"
          class="form-control">
      </div>

      <!-- Price -->
      <div class="mb-3">
        <label class="form-label">Price</label>
        <input
          type="number"
          id="edit-price"
          class="form-control">
      </div>

      <!-- Reorder -->
      <div class="mb-3">
        <label class="form-label">Reorder Level</label>
        <input
          type="number"
          id="edit-reorder"
          class="form-control">
      </div>

      <!-- Change Image -->
      <div class="mb-3">
        <label class="form-label">Change Image</label>
        <input
          type="file"
          id="edit-image"
          class="form-control"
          accept="image/*">
      </div>

      <!-- Current Image -->
      <div class="text-center mb-3">
        <img
          id="edit-preview"
          src="/images/no-image.png"
          style="
            width:120px;
            height:120px;
            object-fit:cover;
            border-radius:10px;
            border:1px solid #ddd;">
      </div>

      <div class="text-end">

        <button
          class="btn btn-secondary me-2"
          onclick="closeEditModal()">
          Cancel
        </button>

        <button
          class="btn btn-primary"
          onclick="submitEdit()">
          Save Changes
        </button>

      </div>

    </div>
  </div>
</div>

<script src="/js/main.js"></script>

<!-- Product Image Preview Modal -->
<div class="modal fade" id="imageModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Product Image</h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal">
        </button>

      </div>

      <div class="modal-body text-center">

        <img
          id="previewImage"
          src=""
          class="img-fluid rounded">

      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
