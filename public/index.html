<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
  
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container d-flex justify-content-between">
    <span class="navbar-brand mb-0 h1">📦 Inventory Management System</span>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container">

  <!-- Dashboard Cards -->
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card text-white bg-primary shadow-sm">
        <div class="card-body">
          <h6 class="card-title">Total Products</h6>
          <h2 id="total-products">0</h2>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-white bg-danger shadow-sm">
        <div class="card-body">
          <h6 class="card-title">Low Stock Items</h6>
          <h2 id="low-stock">0</h2>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-white bg-success shadow-sm">
        <div class="card-body">
          <h6 class="card-title">Inventory Value</h6>
          <h2 id="inventory-value">₹0</h2>
        </div>
      </div>
    </div>
  </div>

  <!-- Stock Chart -->
  <div class="card mb-4">
    <div class="card-body">
      <h2 class="card-title h5 mb-3">Stock Levels</h2>
      <canvas id="stockChart" height="90"></canvas>
    </div>
  </div>

  <!-- Add Product Form -->
  <div class="card mb-4">
    <div class="card-body">
      <h2 class="card-title h5 mb-3">Add Product</h2>
      <form id="productForm" class="row g-3">
        <div class="col-md-3">
          <input type="text" id="name" class="form-control" placeholder="Product Name" required>
        </div>
        <div class="col-md-2">
          <input type="number" id="quantity" class="form-control" placeholder="Quantity" required>
        </div>
        <div class="col-md-2">
          <input type="number" id="price" class="form-control" placeholder="Price" required>
        </div>
        <div class="col-md-3">
          <input type="number" id="reorder" class="form-control" placeholder="Reorder Level" required>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100">Add Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Products Table -->
  <div class="card">
    <div class="card-body">
      <h2 class="card-title h5 mb-3">Products</h2>

      <div class="mb-3">
        <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search products by name...">
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Quantity</th>
              <th>Price</th>
              <th>Reorder Level</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="product-body">

          </tbody>
        </table>
      </div>

      <nav class="mt-3">
        <ul class="pagination justify-content-center" id="pagination"></ul>
      </nav>

    </div>
  </div>

</div>

<!-- Edit Modal -->
<div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
  <div class="card" style="max-width:400px; margin:100px auto;">
    <div class="card-body">
      <h3 class="h5 mb-3">Edit Product</h3>
      <input type="hidden" id="edit-id">

      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" id="edit-name" class="form-control">
     <nav  </div>
      <div class="mb-3">
        <label class="form-label">Quantity</label>
        <input type="number" id="edit-quantity" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Price</label>
        <input type="number" id="edit-price" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Reorder Level</label>
        <input type="number" id="edit-reorder" class="form-control">
      </div>

      <div class="text-end">
        <button class="btn btn-secondary me-2" onclick="closeEditModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitEdit()">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/main.js"></script>
</body>
</html>
