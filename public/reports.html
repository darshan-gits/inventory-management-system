<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Reports Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/style.css">

</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">

        <div class="container d-flex justify-content-between align-items-center">

            <span class="navbar-brand d-flex align-items-center gap-2">
                <i class="bi bi-bar-chart-line"></i> Reports Dashboard
            </span>

            <a href="/" class="btn btn-outline-light btn-sm">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>

        </div>

    </nav>

    <div class="container mt-4">

        <div class="row">

            <!-- Products -->
            <div class="col-md-6 mb-4">

                <div class="card shadow">

                    <div class="card-body">

                        <h4>📦 Products Report</h4>

                        <a href="/api/report/products" class="btn btn-success mt-3">
                            Export Excel
                        </a>

                        <a href="/api/report/products/pdf" class="btn btn-danger mt-3">
                            Export PDF
                        </a>

                    </div>

                </div>

            </div>

            <!-- Audit -->
            <div class="col-md-6 mb-4">

                <div class="card shadow">

                    <div class="card-body">

                        <h4>📋 Audit Report</h4>

                        <a href="/api/audit/export" class="btn btn-success mt-3">
                            Export Excel
                        </a>

                        <a href="/api/audit/pdf" class="btn btn-danger mt-3">
                            Export PDF
                        </a>

                    </div>

                </div>

            </div>

            <!-- Stock History -->
            <div class="col-md-6 mb-4">

                <div class="card shadow">

                    <div class="card-body">

                        <h4>📜 Stock History</h4>

                        <a href="/api/report/products" class="btn btn-success mt-3">
    <i class="bi bi-file-earmark-excel"></i> Export Excel
</a>

<a href="/api/report/products/pdf" class="btn btn-danger mt-3">
    <i class="bi bi-file-earmark-pdf"></i> Export PDF
</a>

                    </div>

                </div>

            </div>

            <!-- Suppliers -->
            <div class="col-md-6 mb-4">

                <div class="card shadow">

                    <div class="card-body">

                        <h4>🚚 Suppliers</h4>

                        <a href="/api/suppliers/export" class="btn btn-success mt-3">
                            Export Excel
                        </a>

                        <a href="/api/suppliers/pdf" class="btn btn-danger mt-3">
                            Export PDF
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
