<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supplier Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
<div class="container d-flex justify-content-between align-items-center">
<span class="navbar-brand d-flex align-items-center gap-2">
<i class="bi bi-truck"></i> Supplier Management
</span>

<a href="/" class="btn btn-outline-light btn-sm">
<i class="bi bi-speedometer2"></i> Dashboard
</a>
</div>
</nav>

<div class="container mt-4">

<div class="card mb-4 shadow">

<div class="card-body">

<h4>Add Supplier</h4>

<div class="mb-3">
    <input
        type="text"
        id="searchSupplier"
        class="form-control"
        placeholder="🔍 Search supplier...">
</div>

<form id="supplierForm" class="row g-3">

<div class="col-md-4">
<input
type="text"
id="supplier_name"
class="form-control"
placeholder="Supplier Name"
required>
</div>

<div class="col-md-4">
<input
type="text"
id="contact_person"
class="form-control"
placeholder="Contact Person">
</div>

<div class="col-md-4">
<input
type="text"
id="phone"
class="form-control"
placeholder="Phone">
</div>

<div class="col-md-4">
<input
type="email"
id="email"
class="form-control"
placeholder="Email">
</div>

<div class="col-md-8">
<input
type="text"
id="address"
class="form-control"
placeholder="Address">
</div>

<div class="col-md-12">
<button class="btn btn-primary">
Add Supplier
</button>
</div>

</form>

</div>

</div>

<div class="card shadow">

<div class="card-body">

<h4>Suppliers</h4>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Supplier</th>
<th>Contact</th>
<th>Phone</th>
<th>Email</th>
<th>Address</th>
<th>Action</th>

</tr>

</thead>

<tbody id="supplier-body">

</tbody>

</table>

</div>

</div>

</div>

<script src="/js/suppliers.js"></script>

</body>
</html>
